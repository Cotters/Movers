appId: com.jcotters.movers
name: Catalogue details and tabs
---
- launchApp
- extendedWaitUntil:
    visible: "Popular Movies"
    timeout: 30000
- repeat:
    times: 3
    commands:
      - tapOn:
          text: "Movie poster for.*"
          index: 0
      - extendedWaitUntil:
          visible: "Add to list"
          timeout: 15000
      - tapOn: "Back"
      - assertVisible: "Popular Movies"
- tapOn: "Watchlists"
- assertVisible: "Create list"
- tapOn: "Profile"
- assertVisible: "Josh"
- assertVisible: "Edit name"
- tapOn: "Home"
- assertVisible: "Popular Movies"
- launchApp
- extendedWaitUntil:
    visible: "Popular Movies"
    timeout: 30000
