name: Movers
options:
  bundleIdPrefix: com.jcotters
  deploymentTarget:
    iOS: '15.0'
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Configuration.xcconfig
  Release: Configuration.xcconfig
targets:
  Movers:
    type: application
    platform: iOS
    sources:
      - path: MoversApp.swift
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Movers
        UILaunchScreen: {}
        TMDB_API_TOKEN: $(TMDB_API_TOKEN)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: com.jcotters.movers.invitation
            CFBundleURLSchemes: [movers]
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jcotters.movers
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: '2.0'
        SWIFT_VERSION: '5.0'
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: '$(inherited) "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"'
        OTHER_LDFLAGS: $(inherited) -framework MoversShared
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
schemes:
  Movers:
    build:
      targets:
        Movers: all
